project:
  title: "HFRVLA: Hierarchical Fast-Reactive VLA"
  question: "Can a small wrist-camera residual module improve frozen SmolVLA action-chunk execution without fine-tuning the slow planner?"
  status: active
  started: "2026-06-04"
  domain: "robot learning / vision-language-action policies"

