hypotheses:
  - id: H1
    statement: "A wrist-camera residual correction module can improve frozen SmolVLA under moderate chunk execution."
    status: supported
    motivation: "The residual path can use per-step wrist evidence while reusing the slow planner's action and latent context."
    parent: null
    priority: high
    current_evidence: "A2C2-wrist 30k with alpha=0.75, delta_max=0.2 reaches 88.0% combined success at planning=50, execution=8; SmolVLA at planning=50, execution=8 is 77.0% in the registry."
  - id: H2
    statement: "Long-horizon fast wrist residual performance depends on training against stale generated chunk actions, not only current-frame residuals."
    status: active
    motivation: "The 2026-06-04 audit found that current FWR training uses a current raw residual target while deployment corrects older chunk actions under the latest wrist observation."
    parent: null
    priority: high
    current_evidence: "FWR action-step 10x10 peaks at 81.5% combined for planning=50, execution=1 and falls to 75.5% at execution=8; code audit shows fast_wrist loss is MSE(delta, expert-current_a_base) and fast-cache v3 reconstructs action chunks from frame-level a_base rather than storing generated chunks with age."
  - id: H3
    statement: "Residual scale calibration explains much of the gap between helpful corrections and degraded performance."
    status: active
    motivation: "The alpha/clip sweep shows a sharp optimum and degradation when the effective residual cap is too large."
    parent: H1
    priority: high
    current_evidence: "At planning=50, execution=8, alpha=0.75 and delta_max=0.2 gives 88.0%, while alpha=1.0 and delta_max=0.4 gives 65.0%."
  - id: H4
    statement: "Long matched chunk failures are dominated by open-loop execution drift that wrist residuals only partially correct."
    status: active
    motivation: "Both policies degrade at long matched chunks, suggesting the problem is not only residual model capacity."
    parent: null
    priority: medium
    current_evidence: "Matched chunk K=50 drops to 46.0% for HFRVLA and 43.0% for SmolVLA; HFRVLA retains a small margin but not high absolute success."
  - id: H5
    statement: "Deployment-aligned final-action loss will reduce alpha/clip fragility."
    status: active
    motivation: "Inference sends a clipped and scaled residual, but fast-wrist training currently optimizes raw current residual MSE."
    parent: H3
    priority: high
    current_evidence: "Alpha=0.75, delta_max=0.2 reaches 88.0% at planning=50/execution=8, while alpha=1.0, delta_max=0.4 falls to 65.0%; unit tests confirm the current fast-wrist objective is raw current residual."

